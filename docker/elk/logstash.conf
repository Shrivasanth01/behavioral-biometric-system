input {
  beats {
    port => 5044
    ssl => false
    client_inactivity_timeout => 60
  }

  tcp {
    port => 5000
    codec => json_lines
    type => "syslog"
  }

  http {
    port => 8080
    codec => json
    type => "application"
  }
}

filter {
  if [type] == "application" {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }

    if [app][timestamp] {
      date {
        match => ["[app][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    if [app][request_id] {
      mutate {
        add_field => { "[@metadata][request_id]" => "%{[app][request_id]}" }
      }
    }

    if [app][level] {
      mutate {
        add_tag => ["app-log"]
      }
    }
  }

  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOG5424LINE}"
      }
      overwrite => ["message"]
    }

    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
    }

    mutate {
      add_tag => ["syslog"]
    }
  }

  if [agent][type] == "filebeat" {
    mutate {
      add_tag => ["filebeat"]
    }
  }

  mutate {
    add_tag => ["bbs-platform"]
    add_field => {
      "environment" => "${ENVIRONMENT:-production}"
      "cluster" => "bbs-platform"
    }
    remove_field => ["[@version]"]
  }

  if [log][file][path] {
    grok {
      match => {
        "[log][file][path]" => "/var/log/(?<service>[^/]+)/%{GREEDYDATA}"
      }
      overwrite => ["service"]
    }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:-elasticsearch:9200}"]
    index => "bbs-logs-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USER:-}"
    password => "${ELASTICSEARCH_PASSWORD:-}"
    ssl => false
    ilm_enabled => true
    ilm_policy => "bbs-logs-policy"
    ilm_rollover_alias => "bbs-logs"
    template_name => "bbs-logs-template"
    template_overwrite => false
    ecs_compatibility => "v8"
    bulk_max_size => 1000
    flush_interval => 5
    idle_flush_time => 10
    retry_max_interval => 300
    retry_initial_interval => 2
  }

  stdout {
    codec => rubydebug
    output_metadata => false
    output_metadata_keys => ["environment", "service", "level"]
  }
}
