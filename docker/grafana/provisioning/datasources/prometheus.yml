apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 30s
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.48.0
      cacheLevel: High
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    version: 1
    editable: false
    jsonData:
      timeField: "@timestamp"
      esVersion: 8.11.0
      maxConcurrentShardRequests: 5
      logLevelField: log.level
      logMessageField: message
