version: "3.8"

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./scripts/seed-db.sh:/docker-entrypoint-initdb.d/seed-db.sh:ro

  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_pass

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql+asyncpg://bbs_user:dev_password@postgres:5432/bbs_platform
      REDIS_URL: redis://:dev_redis_pass@redis:6379/0
      SECRET_KEY: dev-secret-key
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      DEBUG: "1"
      RELOAD: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  celery-worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    volumes:
      - ../backend:/app
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql+asyncpg://bbs_user:dev_password@postgres:5432/bbs_platform
      REDIS_URL: redis://:dev_redis_pass@redis:6379/0
      SECRET_KEY: dev-secret-key
    command: celery -A app.tasks worker --loglevel=debug --concurrency=2

  celery-beat:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    volumes:
      - ../backend:/app
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql+asyncpg://bbs_user:dev_password@postgres:5432/bbs_platform
      REDIS_URL: redis://:dev_redis_pass@redis:6379/0
      SECRET_KEY: dev-secret-key
    command: celery -A app.tasks beat --loglevel=debug

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
      NODE_ENV: development
    command: npm run dev

  security-dashboard:
    build:
      context: ..
      dockerfile: docker/security-dashboard/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ../security-dashboard/src:/app/src
      - ../security-dashboard/public:/app/public
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
      NODE_ENV: development
    command: npm run dev

  ml-service:
    build:
      context: ..
      dockerfile: docker/ml/Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ../ml-service:/app
      - ml-models:/app/models
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
      REDIS_URL: redis://:dev_redis_pass@redis:6379/1
      BATCH_SIZE: 16
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

  elasticsearch:
    ports:
      - "9200:9200"

  logstash:
    ports:
      - "5000:5000"
      - "5044:5044"

  alertmanager:
    ports:
      - "9093:9093"
