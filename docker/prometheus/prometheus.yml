global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "bbs-platform"
    environment: "${ENVIRONMENT:-production}"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          team: platform

  - job_name: "backend"
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend-api
          team: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "$1"

  - job_name: "celery-worker"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["celery-worker:8000"]
        labels:
          service: celery-worker
          team: backend

  - job_name: "ml-service"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["ml-service:8001"]
        labels:
          service: ml-service
          team: data-science
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "frontend"
    metrics_path: /api/metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["frontend:3000"]
        labels:
          service: frontend
          team: frontend

  - job_name: "security-dashboard"
    metrics_path: /api/metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["security-dashboard:3001"]
        labels:
          service: security-dashboard
          team: security

  - job_name: "nginx"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: reverse-proxy
          team: platform
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:9187"]
        labels:
          service: database
          team: platform

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]
        labels:
          service: cache
          team: platform

  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
          team: platform

  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor
          team: platform

  - job_name: "elasticsearch"
    scrape_interval: 30s
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ["elasticsearch:9200"]
        labels:
          service: elasticsearch
          team: platform

  - job_name: "grafana"
    scrape_interval: 30s
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          team: platform

  - job_name: "alertmanager"
    scrape_interval: 30s
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
          team: platform
